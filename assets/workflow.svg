<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="100%" height="210" style="background:#090d16; border-radius:14px; overflow:hidden;">
  <defs>
    <linearGradient id="wfCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d9f5" />
    </linearGradient>

    <linearGradient id="wfPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9f5" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseDash {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodeFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: pulseDash 1.2s linear infinite;
    }
    .node-1 { animation: nodeFloat 3s ease-in-out infinite 0.1s; }
    .node-2 { animation: nodeFloat 3s ease-in-out infinite 0.4s; }
    .node-3 { animation: nodeFloat 3s ease-in-out infinite 0.7s; }
    .node-4 { animation: nodeFloat 3s ease-in-out infinite 1.0s; }
    .node-5 { animation: nodeFloat 3s ease-in-out infinite 1.3s; }
  </style>

  <!-- Border -->
  <rect x="1" y="1" width="878" height="208" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header Title -->
  <text x="440" y="32" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">
    AUTONOMOUS 5-STAGE OPERATIONAL PIPELINE
  </text>

  <!-- Connector Lines with animated pulses -->
  <line class="flow-line" x1="150" y1="110" x2="195" y2="110" stroke="#00f5a0" stroke-width="2.5" />
  <line class="flow-line" x1="325" y1="110" x2="370" y2="110" stroke="#00d9f5" stroke-width="2.5" />
  <line class="flow-line" x1="500" y1="110" x2="545" y2="110" stroke="#38bdf8" stroke-width="2.5" />
  <line class="flow-line" x1="675" y1="110" x2="720" y2="110" stroke="#a855f7" stroke-width="2.5" />

  <!-- Node 1: Discover -->
  <g class="node-1" transform="translate(20, 60)">
    <rect width="130" height="96" rx="10" fill="#0f172a" stroke="#00f5a0" stroke-width="1.2" />
    <circle cx="24" cy="24" r="10" fill="#132e29" stroke="#00f5a0" stroke-width="1" />
    <text x="24" y="28" fill="#00f5a0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">01</text>
    <text x="42" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Discover</text>
    <text x="14" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• CTFtime Registry</text>
    <text x="14" y="68" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• Devpost / MLH</text>
    <text x="14" y="84" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• Company Blogs</text>
  </g>

  <!-- Node 2: Verify -->
  <g class="node-2" transform="translate(195, 60)">
    <rect width="130" height="96" rx="10" fill="#0f172a" stroke="#00d9f5" stroke-width="1.2" />
    <circle cx="24" cy="24" r="10" fill="#0c2d3a" stroke="#00d9f5" stroke-width="1" />
    <text x="24" y="28" fill="#00d9f5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">02</text>
    <text x="42" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Verify</text>
    <text x="14" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• HTTP 200 Reachable</text>
    <text x="14" y="68" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• Canonical Match</text>
    <text x="14" y="84" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• Anti-Hallucination</text>
  </g>

  <!-- Node 3: Normalize -->
  <g class="node-3" transform="translate(370, 60)">
    <rect width="130" height="96" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="24" cy="24" r="10" fill="#14263e" stroke="#38bdf8" stroke-width="1" />
    <text x="24" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">03</text>
    <text x="42" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Normalize</text>
    <text x="14" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• JSON Schema</text>
    <text x="14" y="68" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• ISO 8601 Dates</text>
    <text x="14" y="84" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• Scope &amp; Tags</text>
  </g>

  <!-- Node 4: Filter -->
  <g class="node-4" transform="translate(545, 60)">
    <rect width="130" height="96" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="24" cy="24" r="10" fill="#201b44" stroke="#818cf8" stroke-width="1" />
    <text x="24" y="28" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">04</text>
    <text x="42" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Filter</text>
    <text x="14" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• IANA Timezone</text>
    <text x="14" y="68" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• Region Eligibility</text>
    <text x="14" y="84" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• Mode (Online/Hyb)</text>
  </g>

  <!-- Node 5: Deliver -->
  <g class="node-5" transform="translate(720, 60)">
    <rect width="135" height="96" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="24" cy="24" r="10" fill="#2c1744" stroke="#a855f7" stroke-width="1" />
    <text x="24" y="28" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">05</text>
    <text x="42" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Deliver</text>
    <text x="14" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• HTML Dashboard</text>
    <text x="14" y="68" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• ctf_events.json</text>
    <text x="14" y="84" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• 3H Cron Schedule</text>
  </g>
</svg>
