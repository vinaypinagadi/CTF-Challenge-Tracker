<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="230" style="background:#090d16; border-radius:14px; overflow:hidden;">
  <defs>
    <linearGradient id="wfCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d9f5" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Continuous Flowing Energy Dashes */
    @keyframes flowAnim {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }
    /* Subtle Glowing Card Accents */
    @keyframes pulseGlow {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .flow-dash {
      stroke-dasharray: 6 6;
      animation: flowAnim 1s linear infinite;
    }
    .node-border-1 { animation: pulseGlow 3s ease-in-out infinite 0.0s; }
    .node-border-2 { animation: pulseGlow 3s ease-in-out infinite 0.6s; }
    .node-border-3 { animation: pulseGlow 3s ease-in-out infinite 1.2s; }
    .node-border-4 { animation: pulseGlow 3s ease-in-out infinite 1.8s; }
    .node-border-5 { animation: pulseGlow 3s ease-in-out infinite 2.4s; }
    
    .pulse-dot { animation: beaconBlink 2s ease-in-out infinite; }
  </style>

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="878" height="228" rx="14" fill="#080c14" stroke="#1e293b" stroke-width="1.2" />

  <!-- Section Header -->
  <text x="440" y="32" fill="#64748b" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">
    AUTONOMOUS 5-STAGE OPERATIONAL PIPELINE
  </text>

  <!-- Animated Connection Flow Lines Between Nodes (No CSS transform) -->
  <!-- 01 -> 02 -->
  <line x1="172" y1="116" x2="194" y2="116" stroke="#1e293b" stroke-width="3" />
  <line class="flow-dash" x1="172" y1="116" x2="194" y2="116" stroke="#00f5a0" stroke-width="2.5" />
  <polygon points="194,113 200,116 194,119" fill="#00f5a0" />

  <!-- 02 -> 03 -->
  <line x1="346" y1="116" x2="368" y2="116" stroke="#1e293b" stroke-width="3" />
  <line class="flow-dash" x1="346" y1="116" x2="368" y2="116" stroke="#00d9f5" stroke-width="2.5" />
  <polygon points="368,113 374,116 368,119" fill="#00d9f5" />

  <!-- 03 -> 04 -->
  <line x1="520" y1="116" x2="542" y2="116" stroke="#1e293b" stroke-width="3" />
  <line class="flow-dash" x1="520" y1="116" x2="542" y2="116" stroke="#38bdf8" stroke-width="2.5" />
  <polygon points="542,113 548,116 542,119" fill="#38bdf8" />

  <!-- 04 -> 05 -->
  <line x1="694" y1="116" x2="716" y2="116" stroke="#1e293b" stroke-width="3" />
  <line class="flow-dash" x1="694" y1="116" x2="716" y2="116" stroke="#a855f7" stroke-width="2.5" />
  <polygon points="716,113 722,116 716,119" fill="#a855f7" />

  <!-- ==================== NODE 01: DISCOVER ==================== -->
  <g transform="translate(20, 56)">
    <rect width="152" height="120" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
    <rect class="node-border-1" width="152" height="120" rx="10" fill="none" stroke="#00f5a0" stroke-width="1.5" />
    
    <circle cx="24" cy="24" r="10" fill="#0d2b24" stroke="#00f5a0" stroke-width="1" />
    <text x="24" y="28" fill="#00f5a0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">01</text>
    
    <text x="42" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Discover</text>
    <line x1="14" y1="42" x2="138" y2="42" stroke="#1e293b" stroke-width="1" />
    
    <text x="14" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• CTFtime Feeds</text>
    <text x="14" y="77" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• Devpost / MLH</text>
    <text x="14" y="94" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• Company Portals</text>
    <text x="14" y="111" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">source-registry.md</text>
  </g>

  <!-- ==================== NODE 02: VERIFY ==================== -->
  <g transform="translate(194, 56)">
    <rect width="152" height="120" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
    <rect class="node-border-2" width="152" height="120" rx="10" fill="none" stroke="#00d9f5" stroke-width="1.5" />
    
    <circle cx="24" cy="24" r="10" fill="#092837" stroke="#00d9f5" stroke-width="1" />
    <text x="24" y="28" fill="#00d9f5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">02</text>
    
    <text x="42" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Verify</text>
    <line x1="14" y1="42" x2="138" y2="42" stroke="#1e293b" stroke-width="1" />
    
    <text x="14" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• HTTP 200 Reachable</text>
    <text x="14" y="77" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• TLS &amp; Rules Confirmed</text>
    <text x="14" y="94" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• Anti-Hallucination</text>
    <text x="14" y="111" fill="#00d9f5" font-family="'JetBrains Mono', monospace" font-size="9.5">verified_at Stamp</text>
  </g>

  <!-- ==================== NODE 03: NORMALIZE ==================== -->
  <g transform="translate(368, 56)">
    <rect width="152" height="120" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
    <rect class="node-border-3" width="152" height="120" rx="10" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    
    <circle cx="24" cy="24" r="10" fill="#0f2942" stroke="#38bdf8" stroke-width="1" />
    <text x="24" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">03</text>
    
    <text x="42" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Normalize</text>
    <line x1="14" y1="42" x2="138" y2="42" stroke="#1e293b" stroke-width="1" />
    
    <text x="14" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• 26-Field JSON Draft</text>
    <text x="14" y="77" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• ISO 8601 Timestamps</text>
    <text x="14" y="94" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• Deduplicate URLs</text>
    <text x="14" y="111" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">event-schema.json</text>
  </g>

  <!-- ==================== NODE 04: ELIGIBILITY ==================== -->
  <g transform="translate(542, 56)">
    <rect width="152" height="120" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
    <rect class="node-border-4" width="152" height="120" rx="10" fill="none" stroke="#818cf8" stroke-width="1.5" />
    
    <circle cx="24" cy="24" r="10" fill="#1d1e44" stroke="#818cf8" stroke-width="1" />
    <text x="24" y="28" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">04</text>
    
    <text x="42" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Eligibility</text>
    <line x1="14" y1="42" x2="138" y2="42" stroke="#1e293b" stroke-width="1" />
    
    <text x="14" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• IANA Timezone Map</text>
    <text x="14" y="77" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• Remote Join Clearance</text>
    <text x="14" y="94" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• Mode: Online / Hyb</text>
    <text x="14" y="111" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="9.5">joinable_from_region</text>
  </g>

  <!-- ==================== NODE 05: DELIVER ==================== -->
  <g transform="translate(716, 56)">
    <rect width="144" height="120" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
    <rect class="node-border-5" width="144" height="120" rx="10" fill="none" stroke="#a855f7" stroke-width="1.5" />
    
    <circle cx="24" cy="24" r="10" fill="#2a1642" stroke="#a855f7" stroke-width="1" />
    <text x="24" y="28" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">05</text>
    
    <text x="42" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Deliver</text>
    <line x1="14" y1="42" x2="130" y2="42" stroke="#1e293b" stroke-width="1" />
    
    <text x="14" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• ctf_dashboard.html</text>
    <text x="14" y="77" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• ctf_events.json</text>
    <text x="14" y="94" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• 3-Hour Automation</text>
    <text x="14" y="111" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="9.5">Idempotent Refresh</text>
  </g>

  <!-- Bottom Metric / Status Badge -->
  <g transform="translate(20, 192)">
    <text x="0" y="15" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">
      <tspan fill="#00f5a0">●</tspan> 100% Deterministic Execution  •  Zero Hallucinated Dates/Prizes  •  Rejection Audit Logs Preserved
    </text>
  </g>
</svg>
