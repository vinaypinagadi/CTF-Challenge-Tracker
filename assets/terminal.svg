<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="100%" height="370" style="background:#070b12; border-radius:14px; overflow:hidden;">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#070b12" />
    </linearGradient>
  </defs>

  <style>
    /* Continuous 12-Second Execution Loop */
    @keyframes kLine1 { 0%, 5% { opacity: 0; } 8%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes kLine2 { 0%, 12% { opacity: 0; } 16%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes kLine3 { 0%, 22% { opacity: 0; } 26%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes kLine4 { 0%, 32% { opacity: 0; } 36%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes kLine5 { 0%, 42% { opacity: 0; } 46%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes kLine6 { 0%, 52% { opacity: 0; } 56%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes kLine7 { 0%, 62% { opacity: 0; } 66%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes kLine8 { 0%, 72% { opacity: 0; } 76%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes kLine9 { 0%, 82% { opacity: 0; } 86%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
    
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.1; }
    }

    .tl-1 { animation: kLine1 12s infinite; }
    .tl-2 { animation: kLine2 12s infinite; }
    .tl-3 { animation: kLine3 12s infinite; }
    .tl-4 { animation: kLine4 12s infinite; }
    .tl-5 { animation: kLine5 12s infinite; }
    .tl-6 { animation: kLine6 12s infinite; }
    .tl-7 { animation: kLine7 12s infinite; }
    .tl-8 { animation: kLine8 12s infinite; }
    .tl-9 { animation: kLine9 12s infinite; }
    
    .cursor-prompt {
      animation: cursorBlink 0.8s infinite ease-in-out;
    }
  </style>

  <!-- Terminal Window Background -->
  <rect width="880" height="370" fill="url(#termGrad)" rx="14" stroke="#1f293d" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect width="880" height="38" fill="#111c2e" rx="14" />
  <rect y="26" width="880" height="12" fill="#111c2e" />
  <line x1="0" y1="38" x2="880" y2="38" stroke="#1f293d" stroke-width="1" />

  <!-- Traffic Lights -->
  <circle cx="24" cy="19" r="6" fill="#ff5f56" />
  <circle cx="44" cy="19" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="19" r="6" fill="#27c93f" />

  <!-- Terminal Window Title -->
  <text x="440" y="24" fill="#64748b" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" text-anchor="middle">
    agent@antigravity: ~/skills/ctf-challenge-tracker (zsh)
  </text>

  <!-- Line 1: Command Invocation (y = 70) -->
  <g class="tl-1" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12.5">
    <text x="28" y="70" fill="#00d9f5" font-weight="700">agent</text>
    <text x="75" y="70" fill="#64748b">on</text>
    <text x="96" y="70" fill="#c084fc">main</text>
    <text x="135" y="70" fill="#f8fafc">❯ ctf-tracker --discover --verify --region IN --cadence 3h</text>
  </g>

  <!-- Line 2: Source Registry (y = 100) -->
  <g class="tl-2" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12">
    <text x="28" y="100" fill="#64748b">[00:00:01]</text>
    <text x="110" y="100" fill="#38bdf8" font-weight="700">ℹ [REGISTRY]</text>
    <text x="215" y="100" fill="#94a3b8">Querying CTFtime, Devpost, MLH, HackerOne, Company Feeds... (4 sources)</text>
  </g>

  <!-- Line 3: Candidate Discovery (y = 130) -->
  <g class="tl-3" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12">
    <text x="28" y="130" fill="#64748b">[00:00:03]</text>
    <text x="110" y="130" fill="#00f5a0" font-weight="700">✔ [DISCOVER]</text>
    <text x="215" y="130" fill="#e2e8f0">Extracted <tspan fill="#00f5a0" font-weight="700">32 candidate events</tspan> matching active 30-day time window</text>
  </g>

  <!-- Line 4: Verification Phase (y = 160) -->
  <g class="tl-4" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12">
    <text x="28" y="160" fill="#64748b">[00:00:05]</text>
    <text x="110" y="160" fill="#fbbf24" font-weight="700">⚡ [VERIFY]</text>
    <text x="215" y="160" fill="#e2e8f0">Probing official endpoints &amp; registration URLs (HTTP 200 / TLS valid)</text>
  </g>

  <!-- Line 5: Rejection & Deduplication (y = 190) -->
  <g class="tl-5" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12">
    <text x="28" y="190" fill="#64748b">[00:00:06]</text>
    <text x="110" y="190" fill="#f43f5e" font-weight="700">⚠ [FILTER]</text>
    <text x="215" y="190" fill="#94a3b8">Pruned 6 duplicates &amp; 2 expired/closed contests. Recorded evidence logs.</text>
  </g>

  <!-- Line 6: Regional & Timezone Normalization (y = 220) -->
  <g class="tl-6" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12">
    <text x="28" y="220" fill="#64748b">[00:00:07]</text>
    <text x="110" y="220" fill="#c084fc" font-weight="700">🌐 [REGION]</text>
    <text x="215" y="220" fill="#e2e8f0">Timezone normalized to <tspan fill="#38bdf8">Asia/Kolkata (UTC+05:30)</tspan> • 21 joinable online</text>
  </g>

  <!-- Line 7: Schema Validation (y = 250) -->
  <g class="tl-7" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12">
    <text x="28" y="250" fill="#64748b">[00:00:08]</text>
    <text x="110" y="250" fill="#00f5a0" font-weight="700">✔ [SCHEMA]</text>
    <text x="215" y="250" fill="#e2e8f0">Payload strictly validated against <tspan fill="#00d9f5">references/event-schema.json</tspan></text>
  </g>

  <!-- Line 8: Dashboard Generation Output (y = 280) -->
  <g class="tl-8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12">
    <text x="28" y="280" fill="#64748b">[00:00:09]</text>
    <text x="110" y="280" fill="#00f5a0" font-weight="700">★ [DASHBOARD]</text>
    <text x="215" y="280" fill="#00f5a0" font-weight="700">Compiled standalone ctf_dashboard.html (24 verified events, $165k+ pool)</text>
  </g>

  <!-- Line 9: Next Cadence Standing By (y = 312) -->
  <g class="tl-9" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12">
    <text x="28" y="312" fill="#64748b">[00:00:09]</text>
    <text x="110" y="312" fill="#38bdf8" font-weight="700">⏳ [SCHEDULE]</text>
    <text x="215" y="312" fill="#94a3b8">Next automated refresh armed for 03:00:00 UTC (Cadence: 3h)</text>
    <!-- Blinking Block Cursor -->
    <rect class="cursor-prompt" x="726" y="300" width="8" height="15" fill="#00f5a0" />
  </g>
</svg>
