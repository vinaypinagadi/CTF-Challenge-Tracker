<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="260" style="background:#080c14; border-radius:16px; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="50%" stop-color="#00d9f5" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d9f5" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d9f5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00d9f5" stop-opacity="0.01" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6" />
      <circle cx="0" cy="0" r="1" fill="#00d9f5" opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes scanline {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(280px); opacity: 0; }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes borderStream {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1000; }
    }
    @keyframes badgeGlowPulse {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
    }

    .scanline-bar {
      animation: scanline 4s linear infinite;
    }
    .beacon {
      animation: beaconBlink 1.8s ease-in-out infinite;
    }
    .border-glow {
      stroke-dasharray: 80 40;
      animation: borderStream 25s linear infinite;
    }
    .badge-border {
      animation: badgeGlowPulse 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Background Grid -->
  <rect width="880" height="260" fill="url(#cardBg)" />
  <rect width="880" height="260" fill="url(#cyberGrid)" />

  <!-- Animated Scanline -->
  <rect class="scanline-bar" x="0" y="0" width="880" height="40" fill="url(#gridGrad)" opacity="0.5" pointer-events="none" />

  <!-- High-Tech Border -->
  <rect x="2" y="2" width="876" height="256" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <rect class="border-glow" x="2" y="2" width="876" height="256" rx="14" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.8" />

  <!-- Left Accent Tech Line -->
  <path d="M 0 40 L 40 0 M 0 220 L 40 260" stroke="#00f5a0" stroke-width="2" opacity="0.4" />

  <!-- Radar / Targeting Reticle Graphic (Right Side) -->
  <g opacity="0.75">
    <circle cx="760" cy="130" r="85" fill="none" stroke="#1e293b" stroke-width="1" />
    <circle cx="760" cy="130" r="60" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="760" cy="130" r="35" fill="none" stroke="#00d9f5" stroke-width="1" opacity="0.5" />
    <circle cx="760" cy="130" r="4" fill="#00f5a0" />
    
    <!-- Crosshairs -->
    <line x1="660" y1="130" x2="860" y2="130" stroke="#1e293b" stroke-width="1" />
    <line x1="760" y1="30" x2="760" y2="230" stroke="#1e293b" stroke-width="1" />

    <!-- Radar Sweep Beam (Native SMIL Animation, 100% Reliable in all browsers) -->
    <path d="M 760 130 L 840 80 A 85 85 0 0 0 760 45 Z" fill="url(#neonCyan)" opacity="0.25">
      <animateTransform attributeName="transform" type="rotate" from="0 760 130" to="360 760 130" dur="5s" repeatCount="indefinite" />
    </path>
    
    <!-- Target Blips -->
    <circle cx="795" cy="95" r="3" fill="#00f5a0" filter="url(#softGlow)" />
    <circle cx="730" cy="165" r="2.5" fill="#00d9f5" filter="url(#softGlow)" />
    <circle cx="810" cy="150" r="2" fill="#ff0055" filter="url(#softGlow)" />
  </g>

  <!-- Live Status Badge (Top-Left) -->
  <g transform="translate(48, 38)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle class="beacon" cx="15" cy="13" r="5" fill="#00f5a0" filter="url(#softGlow)" />
    <circle cx="15" cy="13" r="2" fill="#ffffff" />
    <text x="28" y="17" fill="#00f5a0" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1">LIVE FEED // ARMED</text>
    <text x="160" y="17" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">v2.5.0</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(48, 108)">
    <text x="0" y="0" fill="url(#cyberGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" filter="url(#softGlow)">
      CTF CHALLENGE TRACKER
    </text>
    <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="400" letter-spacing="0.2">
      Evidence-Backed Discovery • Regional Eligibility Verification • Autonomous Dashboard Feed
    </text>
  </g>

  <!-- Feature Badges (Bottom Row, Explicit Static Placement with Glowing Borders) -->
  <g transform="translate(48, 175)">
    <!-- Badge 1: Universal AI -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="158" height="30" rx="8" fill="#131e36" stroke="#00d9f5" stroke-width="1.2" class="badge-border" />
      <text x="14" y="19" fill="#00d9f5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">⚡ ALL AI AGENTS</text>
    </g>

    <!-- Badge 2: Zero Hallucination -->
    <g transform="translate(170, 0)">
      <rect x="0" y="0" width="175" height="30" rx="8" fill="#131e36" stroke="#00f5a0" stroke-width="1.2" class="badge-border" />
      <text x="14" y="19" fill="#00f5a0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">🛡️ ZERO HALLUCINATION</text>
    </g>

    <!-- Badge 3: 3H Auto Refresh -->
    <g transform="translate(357, 0)">
      <rect x="0" y="0" width="160" height="30" rx="8" fill="#131e36" stroke="#a855f7" stroke-width="1.2" class="badge-border" />
      <text x="14" y="19" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">🔄 3-HOUR CADENCE</text>
    </g>

    <!-- Badge 4: Clean HTML -->
    <g transform="translate(529, 0)">
      <rect x="0" y="0" width="150" height="30" rx="8" fill="#131e36" stroke="#f59e0b" stroke-width="1.2" class="badge-border" />
      <text x="14" y="19" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">📊 HTML DASHBOARD</text>
    </g>
  </g>
</svg>
